<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>拾物 ChatGPT 连接</title><style>body{font:14px system-ui;width:340px;padding:16px;color:#243e31}input{width:96%;padding:8px;margin:6px 0}button{padding:8px;margin:8px 4px 0 0}p{line-height:1.6;overflow-wrap:anywhere}small{color:#68786e}</style><h2>拾物 · 连接日常Chrome</h2><p id="version"></p><p>在工作台「浏览器接入设置」复制本机连接码，粘贴到这里。无需提供GPT密码或Cookie。</p><label>本机工作台地址<input id="base" value="http://127.0.0.1:3210"></label><label>本机连接码<input id="key" type="password" autocomplete="off"></label><button id="connect">连接</button><button id="disconnect">断开</button><p id="status" role="status"></p><small>需要Chrome调试权限进行原生点击、输入与上传，Chrome会显示调试提示条，可随时取消。仅附加本次ChatGPT任务标签页；不读取密码或Cookie，不操作Google登录和Chrome设置页。仅处理工作台下发的单张任务，在独立ChatGPT标签页运行；每张最多发送一次，不绕过验证。原图发送至ChatGPT，成品先保存到Downloads/shiwu-results，再由工作台保存。</small><script src="popup.js"></script></html>
